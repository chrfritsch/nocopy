<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" width="720" height="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" role="img">
<title>Symfony cache-heavy pages: products?page=3: nocopy 17,430 req/s (105% of an empty page), APCu 4,542 (25%); product/77: nocopy 15,801 req/s (95% of an empty page), APCu 4,416 (24%). An empty page serves 18,182 to 16,660 req/s.</title>
<text fill="#f0f6fc" x="0" y="18" font-size="14" font-weight="600">Symfony, cache-heavy pages (req/s, php-fpm, 8 workers)</text>
<rect fill="#3987e5" x="0" y="34" width="12" height="12" rx="2"/><text fill="#f0f6fc" x="18" y="44">nocopy (bundle)</text>
<rect fill="#d95926" x="130" y="34" width="12" height="12" rx="2"/><text fill="#f0f6fc" x="148" y="44">APCu (no marshaller)</text>
<line stroke="#262c36" x1="150.0" y1="72" x2="150.0" y2="178"/><text fill="#9198a1" font-size="11" x="150.0" y="194" text-anchor="middle">0k</text>
<line stroke="#262c36" x1="285.0" y1="72" x2="285.0" y2="178"/><text fill="#9198a1" font-size="11" x="285.0" y="194" text-anchor="middle">5k</text>
<line stroke="#262c36" x1="420.0" y1="72" x2="420.0" y2="178"/><text fill="#9198a1" font-size="11" x="420.0" y="194" text-anchor="middle">10k</text>
<line stroke="#262c36" x1="555.0" y1="72" x2="555.0" y2="178"/><text fill="#9198a1" font-size="11" x="555.0" y="194" text-anchor="middle">15k</text>
<line stroke="#262c36" x1="690.0" y1="72" x2="690.0" y2="178"/><text fill="#9198a1" font-size="11" x="690.0" y="194" text-anchor="middle">20k</text>
<rect fill="#9198a1" opacity=".35" x="640.9" y="66" width="-41.1" height="112"/>
<text fill="#9198a1" x="599.8" y="60" text-anchor="end">empty page, no cache: the host's limit</text>
<text fill="#f0f6fc" x="140" y="103" text-anchor="end">products?page=3</text>
<path fill="#3987e5" d="M150,82h466.6a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-466.6z"/>
<text fill="#0d1117" font-weight="600" x="612.6" y="94" text-anchor="end">17,430 (105%)</text>
<path fill="#d95926" d="M150,100h118.6a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-118.6z"/>
<text fill="#f0f6fc" x="278.6" y="112">4,542 (25%)</text>
<text fill="#f0f6fc" x="140" y="159" text-anchor="end">product/77</text>
<path fill="#3987e5" d="M150,138h422.6a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-422.6z"/>
<text fill="#0d1117" font-weight="600" x="568.6" y="150" text-anchor="end">15,801 (95%)</text>
<path fill="#d95926" d="M150,156h115.2a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-115.2z"/>
<text fill="#f0f6fc" x="275.2" y="168">4,416 (24%)</text>
<line stroke="#656c76" x1="150" y1="72" x2="150" y2="178"/>
<text fill="#9198a1" font-size="11" x="0" y="222">(%) = share of the empty page. Docker on arm64, PHP 8.5, 2026-11-06, ./dev sfbench.</text>
