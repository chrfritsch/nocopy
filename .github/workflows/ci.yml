name: ci
on: [push, pull_request]
# every step is a ./dev command: run the same locally (./dev ci runs the lot)
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - run: ./dev test
      - run: ./dev novalkey
      # release build, loop: races show up only sometimes (see ARCHITECTURE.md invariants)
      - run: ./dev stress 30
      - run: ./dev c 5
      - run: ./dev shm
  zts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: ./dev zts
      - run: ./dev frankenphp
  symfony:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: "8.4", symfony: "6.4.*"}
          - {php: "8.4", symfony: "7.4.*"}
          - {php: "8.5", symfony: "8.*"}
    runs-on: ubuntu-latest
    env:
      PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - run: ./dev symfony "${{ matrix.symfony }}"
