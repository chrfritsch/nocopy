name: ci
on: [push, pull_request]
# every step is a ./dev command: run the same locally (./dev ci runs the lot)
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - run: ./dev test
      - run: ./dev novalkey
      # release build, loop: races show up only sometimes (docs/explanation/architecture.md, invariants)
      - run: ./dev stress 30
      # gcc's TSan dies on the runner's 32-bit mmap ASLR ("unexpected memory mapping")
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: ./dev c 5
      - run: ./dev shm
      - run: ./dev pie
  # gcc -Werror is in every build above; these once, on one PHP
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: ./dev tidy
      - run: ./dev asan
      - run: ./dev fuzz
      # PHP built with --enable-debug: the engine's own assertions (immutable refcounts, hash tables)
      - run: ./dev debug
      - run: ./dev debug fuzz
      - run: ./dev clang
      - run: ./dev apcu
  zts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ./dev zts
      - run: ./dev frankenphp
  symfony:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: "8.4", symfony: "6.4.*"}
          - {php: "8.4", symfony: "7.4.*"}
          - {php: "8.5", symfony: "8.*"}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - run: ./dev symfony "${{ matrix.symfony }}"
