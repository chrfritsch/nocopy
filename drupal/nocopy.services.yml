services:
  cache.backend.nocopy:
    class: Drupal\nocopy\Cache\NocopyBackendFactory
    arguments: ['%app.root%', '%site.path%', '@cache_tags.invalidator.checksum', '@datetime.time']
  # As ChainedFastBackend's fast layer: a cache per process will do, and none where the extension is missing.
  cache.backend.nocopy_fast:
    class: Drupal\nocopy\Cache\NocopyBackendFactory
    arguments: ['%app.root%', '%site.path%', '@cache_tags.invalidator.checksum', '@datetime.time', true]
